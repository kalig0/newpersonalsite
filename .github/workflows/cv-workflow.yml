name: Portable CV workflow

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Node 26 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run test:cv
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
